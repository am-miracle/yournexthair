# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: yournexthair-web-prod
    runtime: node
    branch: master
    region: frankfurt
    plan: 1c-2g
    rootDir: storefront
    autoDeployTrigger: 'off'
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm exec next start --hostname 0.0.0.0 --port "$PORT"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: NEXT_PUBLIC_MEDUSA_BACKEND_URL
        fromService:
          type: web
          name: yournexthair-api-prod
          envVarKey: BACKEND_URL
      - key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        fromService:
          type: web
          name: yournexthair-web-prod
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_DEFAULT_REGION
        value: ng
      - key: STOREFRONT_REVALIDATE_SECRET
        fromService:
          type: web
          name: yournexthair-api-prod
          envVarKey: STOREFRONT_REVALIDATE_SECRET
      - key: S3_FILE_URL
        fromService:
          type: web
          name: yournexthair-api-prod
          envVarKey: S3_FILE_URL
      - key: NEXT_PUBLIC_FEATURE_SEARCH_ENABLED
        value: 'false'
      - key: NEXT_PUBLIC_ENABLE_WEBMCP
        value: 'false'
      - key: NEXT_PUBLIC_APP_ENV
        value: production
