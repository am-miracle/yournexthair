# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: yournexthair-api-dev
    runtime: node
    branch: develop
    region: frankfurt
    plan: free
    rootDir: medusa
    autoDeployTrigger: "off"
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build && cp pnpm-lock.yaml .npmrc
      .medusa/server/ && cd .medusa/server && pnpm install --frozen-lockfile --prod
    startCommand: >-
      cd .medusa/server && pnpm exec medusa db:migrate && pnpm exec medusa exec
      ./src/scripts/bootstrap-render-free.js && pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.x
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: development
      - key: PORT
        value: "9000"
      - key: HOST
        value: 0.0.0.0
      - key: MEDUSA_WORKER_MODE
        value: shared
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: yournexthair-redis-dev
          property: connectionString
      - key: BACKEND_URL
        fromService:
          type: web
          name: yournexthair-api-dev
          envVarKey: RENDER_EXTERNAL_URL
      - key: STOREFRONT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STOREFRONT_REVALIDATE_SECRET
        generateValue: true
      - key: S3_FILE_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: BACHS_SECRET_KEY
        sync: false
      - key: BACHS_WEBHOOK_SECRET
        sync: false
      - key: DHL_API_USERNAME
        sync: false
      - key: DHL_API_PASSWORD
        sync: false
      - key: DHL_ACCOUNT_NUMBER
        sync: false
      - key: DHL_ENVIRONMENT
        value: sandbox
  - type: keyvalue
    name: yournexthair-redis-dev
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    persistenceMode: "off"
    ipAllowList: []
