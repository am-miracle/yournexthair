name: E2E

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.15.1"

  DATABASE_URL: postgres://postgres@localhost:5432/medusa
  REDIS_URL: redis://localhost:6379
  BACKEND_URL: http://localhost:9000
  STOREFRONT_URL: http://localhost:8000
  STORE_CORS: http://localhost:8000
  ADMIN_CORS: http://localhost:9000
  AUTH_CORS: http://localhost:8000,http://localhost:9000
  # Uploads (the seed's product and collection images) go to disk and are served from /static.
  MEDUSA_FILE_STORAGE: local

  NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
  NEXT_PUBLIC_BASE_URL: http://localhost:8000
  NEXT_PUBLIC_DEFAULT_REGION: ng
  NEXT_PUBLIC_FEATURE_SEARCH_ENABLED: "false"

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: medusa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Generate test secrets
        run: |
          for name in JWT_SECRET COOKIE_SECRET STOREFRONT_REVALIDATE_SECRET RECEIPT_ACCESS_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            medusa/pnpm-lock.yaml
            storefront/pnpm-lock.yaml

      - name: Install backend
        working-directory: medusa
        run: pnpm install --frozen-lockfile

      - name: Build backend
        working-directory: medusa
        run: |
          pnpm build
          cp pnpm-lock.yaml .npmrc .medusa/server/
          cd .medusa/server && pnpm install --frozen-lockfile --prod

      # Run from the built server so seeded uploads land in the static dir it serves.
      - name: Migrate and seed
        working-directory: medusa/.medusa/server
        run: |
          npx medusa db:migrate
          npx medusa exec ./src/scripts/seed.js

      - name: Start backend
        working-directory: medusa/.medusa/server
        run: |
          NODE_ENV=production nohup npx medusa start > "$RUNNER_TEMP/medusa.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:9000/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/medusa.log"
          exit 1

      - name: Read publishable key
        run: |
          key=$(psql -h localhost -U postgres -d medusa -tAc \
            "select token from api_key where type = 'publishable' and revoked_at is null order by created_at limit 1")
          test -n "$key"
          echo "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Install storefront
        working-directory: storefront
        run: pnpm install --frozen-lockfile

      - name: Build storefront
        working-directory: storefront
        run: pnpm build

      - name: Install Playwright browser
        working-directory: storefront
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        working-directory: storefront
        run: pnpm test-e2e

      - name: Backend log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/medusa.log"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            storefront/playwright-report
            storefront/test-results
          retention-days: 14
